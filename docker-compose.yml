services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-it-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_it
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk123
    ports:
      - "5432:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_it"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  helpdesk_pgdata:
